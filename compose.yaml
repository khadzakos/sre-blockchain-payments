name: sre-payments
x-app: &app
  image: sre-payments:${RELEASE_VERSION:-dev}
  build:
    context: .
    args:
      VERSION: ${RELEASE_VERSION:-dev}
  environment: &env
    DATABASE_URL: postgres://payments:${POSTGRES_PASSWORD:?Copy .env.example to .env}@db:5432/payments?sslmode=disable
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  read_only: true
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  init: true
  stop_grace_period: 15s
services:
  db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      POSTGRES_DB: payments
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payments -d payments']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: [migrate]
    depends_on:
      db: { condition: service_healthy }
  api:
    <<: *app
    command: [api]
    environment:
      <<: *env
      PORT: '8080'
    ports: ['127.0.0.1:${HTTP_PORT:-8080}:8080']
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/readyz']
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    <<: *app
    command: [worker]
    environment:
      <<: *env
      WORKER_INTERVAL: ${WORKER_INTERVAL:-5s}
    depends_on:
      migrate: { condition: service_completed_successfully }
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    command:
      [
        '--config.file=/etc/prometheus/prometheus.yaml',
        '--storage.tsdb.path=/prometheus',
        '--storage.tsdb.retention.time=7d',
      ]
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
  victorialogs:
    profiles: [monitoring]
    image: victoriametrics/victoria-logs:v1.53.0
    command: ['-storageDataPath=/victoria-logs-data', '-retentionPeriod=7d']
    ports: ['127.0.0.1:9428:9428']
    volumes:
      - victorialogs-data:/victoria-logs-data
  tempo:
    profiles: [monitoring]
    image: grafana/tempo:2.8.2
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
  alloy:
    profiles: [monitoring]
    image: grafana/alloy:v1.10.2
    command:
      [
        'run',
        '--server.http.listen-addr=0.0.0.0:12345',
        '--storage.path=/var/lib/alloy/data',
        '/etc/alloy/config.alloy',
      ]
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [victorialogs, tempo]
  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-grafana-password-change-me}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource@0.32.0
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, victorialogs, tempo]
volumes:
  postgres-data:
  prometheus-data:
  victorialogs-data:
  tempo-data:
  alloy-data:
  grafana-data:
