apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../minikube
  - ../../observability
  - namespace.yaml
  - victorialogs.yaml
  - tempo.yaml
  - alloy.yaml
  - grafana.yaml
configMapGenerator:
  - name: payments-telemetry
    namespace: sre-payments
    literals:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy.observability.svc.cluster.local:4318
patches:
  - target:
      kind: Deployment
      name: payments-api
      namespace: sre-payments
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: payments-telemetry
  - target:
      kind: Deployment
      name: payments-worker
      namespace: sre-payments
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: payments-telemetry
replicas:
  - name: payments-api
    count: 3
  - name: payments-worker
    count: 2
