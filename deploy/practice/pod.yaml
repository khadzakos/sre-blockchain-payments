apiVersion: v1
kind: Pod
metadata:
  name: kubectl-practice
  namespace: sre-payments
  labels:
    app: kubectl-practice
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: practice
      image: sre-payments:minikube
      imagePullPolicy: Never
      command: [/bin/sh, -c]
      args: ['payments version; sleep 3600']
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
