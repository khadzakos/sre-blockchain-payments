apiVersion: batch/v1
kind: Job
metadata:
  name: payments-migrate
  namespace: sre-payments
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: payments-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: sre-payments:minikube
          imagePullPolicy: Never
          args: [migrate]
          envFrom:
            - configMapRef:
                name: payments-config
            - secretRef:
                name: payments-db
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
