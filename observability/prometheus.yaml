global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: payments-api
    static_configs:
      - targets: [api:8080]
  - job_name: payments-worker
    static_configs:
      - targets: [worker:8080]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: victorialogs
    static_configs:
      - targets: [victorialogs:9428]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
