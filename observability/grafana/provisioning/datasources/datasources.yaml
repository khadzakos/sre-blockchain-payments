apiVersion: 1
deleteDatasources:
  - name: Loki
    orgId: 1
datasources:
  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: Open trace
        - name: request_id
          matcherType: label
          matcherRegex: request_id
          datasourceUid: victorialogs
          url: 'request_id:="$${__value.raw}"'
          urlDisplayLabel: Request logs
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: victorialogs
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        customQuery: true
        query: 'trace_id:="$${__trace.traceId}" AND span_id:="$${__span.spanId}"'
